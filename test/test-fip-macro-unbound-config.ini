;
; Negative test config: uses the test_instrument macro but leaves the 'baro'
; parameter of the HSI page unbound, which must make parsing fail.

log_level="TRACE"
aircraft_acf="generic.acf"

[device:id="saitek_fip_screen"]
serial="MZB05779E2"

    [screen:id="fip-screen"]
    @use="test_instrument"

    [@page:id="HSI"]
    @parameter="name:course,value:dataref:sim/test/course,scale:-1.0"
