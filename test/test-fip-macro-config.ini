;
; FIP macro expansion test config: uses the test_instrument macro and binds its
; HSI page parameters. The STATIC page has no parameters, so it needs no binding block.

log_level="TRACE"
aircraft_acf="generic.acf"

[device:id="saitek_fip_screen"]
serial="MZB05779E2"

    [screen:id="fip-screen"]
    @use="test_instrument"

    [@page:id="HSI"]
    @parameter="name:course,value:dataref:sim/test/course,scale:-1.0"
    @parameter="name:baro,value:lua:get_baro()"
