; Minimal fixture: Saitek Multi Panel using a plain [display:] (GenericDisplay)
; instead of [multi_display:] on MULTI_DISPLAY_UP.
;
; Regression fixture for https://github.com/norberttak/XPanel/issues/124
; (generic display never refreshed because nr_of_bytes was never initialized
; for GenericDisplay objects on the Saitek Multi/Radio panels).
;
; SPDX-License-Identifier: GPL-3.0-or-later

aircraft_acf="generic.acf"
script_file="test-script.lua"

[device:id="saitek_multi"]
vid="12AB"
pid="34CD"

[display:id="MULTI_DISPLAY_UP"]
line="dataref:sim/custom/gauges/compas/pkp_helper_course_L"
